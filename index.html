<!DOCTYPE html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulce &amp; Café — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=DM+Sans:wght@400;500&amp;display=swap">
<style>
:root{--ink:#2b1d16;--paper:#f4efe6;--cream:#e9dfd0;--brass:#664830;--desk:#17100c;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;align-items:center;font-family:var(--serif);color:var(--ink);
background:radial-gradient(ellipse at 50% 30%,#2a1c14 0,var(--desk) 75%);overflow:hidden;-webkit-tap-highlight-color:transparent}
#tabs{position:relative;display:flex;gap:4px;width:100%;max-width:520px;padding:12px 14px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--cream);opacity:.6;font:500 14px var(--sans);padding:8px 11px;cursor:pointer;transition:opacity 1s ease}
#tabs button.on{opacity:1}
#ink{position:absolute;left:0;bottom:6px;height:1px;background:var(--cream);pointer-events:none;transition:transform 1.1s cubic-bezier(.45,.02,.2,1),width 1.1s cubic-bezier(.45,.02,.2,1)}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:8px 14px;perspective:1900px}
#book{perspective:1900px;position:relative;width:min(100%,440px);height:min(100%,740px);touch-action:pan-y;user-select:none;-webkit-user-select:none}
#book::before{content:"";position:absolute;inset:6px -6px -6px 6px;background:#0007;border-radius:4px 10px 10px 4px;filter:blur(10px)}
.page{position:absolute;inset:0;background:var(--paper);border-radius:2px 10px 10px 2px;overflow-y:auto;scrollbar-width:none;
transform-origin:left center;backface-visibility:hidden;transition:transform 1.3s cubic-bezier(.45,.02,.2,1),filter 1.3s ease,opacity .15s}
.page,.page *{touch-action:pan-y}
.page::-webkit-scrollbar{display:none}
.page.off{transform:rotateY(-104deg);filter:brightness(.78);opacity:0;pointer-events:none;transition:transform 1.3s cubic-bezier(.45,.02,.2,1),filter 1.3s ease,opacity .3s 1s}
.spine{position:sticky;top:0;height:0;pointer-events:none}
.spine::after{content:"";position:absolute;left:0;top:0;width:30px;height:100dvh;background:linear-gradient(90deg,#2b1d1626,transparent);z-index:2}
.in{padding:38px 30px 76px 40px;min-height:100%;position:relative}
h2{font:500 36px/1.05 var(--serif);margin:0 0 6px;letter-spacing:.2px}
.sub{margin:0 0 22px;font:italic 400 17px var(--serif);color:var(--brass);padding-bottom:16px;border-bottom:1px solid var(--ink)}
.grp{font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:22px 0 2px}
.it{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid #2b1d1618}
.it .nm{font-weight:500;font-size:20px;line-height:1.2}
.it small{display:block;font:400 13px var(--sans);color:#2b1d16d0;margin-top:2px}
.it .pr{margin-left:auto;font:500 15px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.fav{margin-left:8px;font:italic 400 15px var(--serif);color:var(--brass)}
.pg{position:absolute;bottom:34px;left:0;right:0;text-align:center;font:italic 15px var(--serif);color:var(--brass)}
.lgw{position:relative;width:min(90%,390px)}.cover .lg{width:100%;height:auto;display:block}
.lgw{-webkit-touch-callout:none;user-select:none}.lgw img{pointer-events:none;-webkit-user-drag:none}
.wisp{filter:blur(.5px);position:absolute;height:auto;pointer-events:none;opacity:0;animation:wisp 3.6s ease-in-out infinite}
@keyframes wisp{0%{opacity:0;transform:translate(0,14%)}25%{opacity:var(--o,1)}70%{opacity:calc(var(--o,1)*.8)}100%{opacity:0;transform:translate(8%,-38%)}}
@media (prefers-reduced-motion:reduce){.wisp{animation:none;opacity:1}}
.cover{background:radial-gradient(ellipse at 50% 40%,#2a190d,#201208 85%)!important;color:#d9b98f;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.cover h1{margin:18px 0 0;font:500 clamp(34px,10.6vw,50px)/1 var(--serif);letter-spacing:.02em;white-space:nowrap;background:linear-gradient(180deg,#f3d9b4,#b98756);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover h1 b{font-weight:500;font-size:1.16em}.cover h1 i{font-weight:400}
.cover .sw{width:76%;max-width:300px;margin:-2px 0 6px;display:block}
.cover p{margin:0;font:italic 400 clamp(19px,5.6vw,24px) var(--serif);color:#d3b189}
.cover .hint{margin-top:42px;font:400 13px var(--sans);color:#9c8672;animation:pulse 2.6s ease-in-out infinite}
.steam path:nth-child(1){stroke:#8a7058}.steam path:nth-child(2){stroke:#bba386}.steam path:nth-child(3){stroke:#f1e2cc}
@keyframes pulse{50%{opacity:.2}}
.steam path{fill:none;stroke:var(--cream);stroke-width:2;stroke-linecap:round;opacity:0;animation:rise 3.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.9s}.steam path:nth-child(3){animation-delay:1.8s}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}35%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
.end p{font-size:22px;line-height:1.35;margin:0 0 14px}
.end .sm{font:400 13px/1.5 var(--sans);color:#2b1d16d0}
.end .btn{margin-top:16px;font:500 14px var(--sans);background:var(--ink);color:var(--paper);border:0;padding:12px 22px;border-radius:2px;cursor:pointer}
#bar{flex:none;height:44px;display:flex;align-items:center;justify-content:center;color:var(--cream)}
#bar button{border:1px solid #e9dfd04d;background:none;color:var(--cream);width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
#bar button:disabled{opacity:.25}
#cnt{font:italic 17px var(--serif);opacity:.8}
.more{position:sticky;bottom:0;height:78px;margin-top:-78px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;pointer-events:none;z-index:3;
background:linear-gradient(to bottom,#f4efe600,var(--paper) 78%);transition:opacity .25s}
.more.hide{opacity:0}
.more span{font:italic 500 16px var(--serif);color:var(--brass);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#bar{width:100%;max-width:440px;padding:0 14px}#cnt{flex:1;text-align:center}
.ob{border:1px solid #e9dfd04d;background:none;color:var(--cream);font:500 13px var(--sans);padding:8px 14px;border-radius:99px;cursor:pointer}
.ed .it{background:#8c6b4a14;cursor:pointer}.ed .it:active{background:#8c6b4a33}
.out .nm{text-decoration:line-through;opacity:.5}.it .pr.ag{font:italic 16px var(--serif);color:var(--brass)}
.ph{width:100%;max-height:230px;object-fit:cover;border-radius:4px;margin:2px 0 14px;display:block}
.st{font:500 30px/1.1 var(--serif)}.sd{font-size:19px;line-height:1.35;margin:10px 0}.sp{font:500 20px var(--sans)}
.eb{margin-top:18px;font:500 14px var(--sans);background:var(--ink);color:var(--paper);border:0;padding:11px 18px;border-radius:2px;cursor:pointer}
#sh{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:86%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.8,.3,1);z-index:20}
#sh.open{transform:none}
#sh h3{font:500 26px var(--serif);margin:0 0 6px;display:flex;justify-content:space-between}
#sh .x{border:0;background:none;font-size:28px;color:var(--ink);cursor:pointer}
#sh label{display:block;font:500 13px var(--sans);margin:12px 0 0;color:#2b1d16b0}
#sh input,#sh select,#sh textarea{display:block;width:100%;margin-top:4px;font:16px var(--sans);padding:11px;border:1px solid #2b1d1640;border-radius:4px;background:#fff8;color:var(--ink)}
#sh .ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}#sh .ck input{width:auto;margin:0}
#sh .go,#sh .dl{display:block;width:100%;margin-top:14px;font:500 15px var(--sans);padding:14px;border:0;border-radius:2px;cursor:pointer}
#sh .go{background:var(--ink);color:var(--paper)}#sh .dl{background:none;color:#9b2c1d;border:1px solid #9b2c1d55}
.nt .page{transition:none!important}
.spine{display:none}.page:not(.cover){background-image:linear-gradient(90deg,#2b1d1626,transparent 30px)}
#bar .ob{width:auto;height:auto;border-radius:99px;font:500 13px var(--sans);padding:8px 14px}
button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.page,.page.off{transition-duration:.01s!important;transition-delay:0s!important}.steam path,.hint,.more span{animation:none}}
</style>
</head>
<body>
<div id="tabs" role="tablist"></div>
<div id="stage"><div id="book"></div></div>
<nav id="bar"><button class="ob" id="e1" hidden="">Editar</button><span id="cnt"></span><button class="ob" id="e2" hidden="">+ Producto</button></nav>
<div id="sh" inert=""></div>
<script>
fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(D=>{
const $=s=>document.querySelector(s),fmt=n=>'$'+n.toLocaleString('es-CO'),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DATA=D,M=D.m;
const book=$('#book'),tabs=$('#tabs'),sh=$('#sh');let idx=0,timers=[],busyUntil=0,pages=[],N=0,V=[],owner=false,edit=false,ink=null;
const cup=`<svg width="110" height="110" viewBox="0 0 120 120" aria-hidden="true"><g class="steam"><path d="M42 36c-8-8 8-14 0-24"/><path d="M60 36c-8-8 8-14 0-24"/><path d="M78 36c-8-8 8-14 0-24"/></g><path d="M24 50h66v22a28 28 0 0 1-28 28H52a28 28 0 0 1-28-28z" fill="none" stroke="#f3e6d2" stroke-width="2.5"/><path d="M90 58h6a10 10 0 0 1 0 20h-8" fill="none" stroke="#f3e6d2" stroke-width="2.5"/><path d="M14 108h86" stroke="#f3e6d2" stroke-width="2.5" stroke-linecap="round"/></svg>`;
function upd(el){const m=el.querySelector('.more');if(m)m.classList.toggle('hide',el.scrollHeight-el.scrollTop-el.clientHeight<70)}
function add(html,cls){const s=document.createElement('section');s.className='page '+(cls||'');s.innerHTML=html;if(cls!=='cover'){s.insertAdjacentHTML('beforeend','<div class="more"><span>Hay más abajo · desliza hacia arriba ⌄</span></div>');s.addEventListener('scroll',()=>upd(s),{passive:true})}pages.push(s);book.append(s)}
function rows(p,si){let h='';p.i.forEach((r,ri)=>{
 if(r.h){h+=`<div class="grp">${esc(r.h)}</div>`;return}
 const [n,pr,note,fav,out]=r;
 h+=`<div class="it${out?' out':''}"${edit?` data-e="${si},${ri}"`:''}><span class="nm">${esc(n)}${fav?'<span class="fav">favorito</span>':''}${note?`<small>${esc(note)}</small>`:''}</span>${out?'<span class="pr ag">agotado</span>':p.fl?'':`<span class="pr">${pr?fmt(pr):'Consultar'}</span>`}</div>`});
 if(p.fl&&!p.i.length)h+='<p class="sd">Pregunta por los sabores de hoy.</p>';
 return h}
function boot(){
 book.innerHTML='';tabs.innerHTML='';pages=[];book.classList.toggle('ed',edit);
 add(`<div class="lgw"><img class="lg" src="img/logo.webp" alt="Dulce &amp; Café — el aroma que endulza tu día"><img class="wisp" alt="" style="left:43.35%;top:2.98%;width:2.20%;animation-delay:0s;--o:1" src="img/v1.webp"><img class="wisp" alt="" style="left:47.75%;top:2.98%;width:2.51%;animation-delay:1.1s;--o:.4" src="img/v2.webp"><img class="wisp" alt="" style="left:51.94%;top:2.98%;width:2.51%;animation-delay:2.2s;--o:.3" src="img/v3.webp"></div><div class="hint">Toca o desliza para abrir</div>`,'cover');
 V=(DATA.star.t||owner?[{star:1,tab:'Destacado'}]:[]).concat(M);
 V.forEach(p=>{const si=M.indexOf(p),n=pages.length+1;let h='<div class="spine"></div><div class="in">';
  if(p.star){const x=DATA.star;h+=`<h2>${esc(x.k)}</h2><p class="sub">Lo mejor de la casa</p>${x.img?`<img class="ph" src="${x.img}" alt="">`:''}<div class="st">${esc(x.t)||'Aquí va tu destacado'}</div><p class="sd">${esc(x.d)}</p>${x.p?`<div class="sp">${fmt(x.p)}</div>`:''}${edit?'<button class="eb" id="es">Editar destacado</button>':''}`}
  else h+=`<h2>${p.t}</h2><p class="sub">${p.s}</p>${rows(p,si)}`;
  add(h+`<div class="pg">${n}</div></div>`)});
 add(`<div class="spine"></div><div class="in end"><h2>¿Ya nos probaste?</h2><p class="sub">Te esperamos</p><p>Lunes a sábado<br>8:00 am – 8:00 pm</p><p>Domicilios y para llevar.</p><p class="sm">Precios incluyen impuestos · productos sujetos a disponibilidad.</p><button class="btn" id="home">Volver a la portada</button></div>`);
 N=pages.length;pages.forEach((el,i)=>el.style.zIndex=N-i);
 const mk=(t,p)=>{const b=document.createElement('button');b.textContent=t;b.dataset.p=p;b.onclick=()=>go(p);tabs.append(b)};
 mk('Portada',0);V.forEach((p,i)=>p.tab&&mk(p.tab,i+1));mk('¿Ya nos probaste?',N-1);
 ink=document.createElement('i');ink.id='ink';tabs.append(ink);idx=0;
 $('#home').onclick=()=>go(0)}
boot();
let curTab=null,sid=0;
function place(){const b=curTab;if(!b)return;ink.style.transform=`translateX(${b.offsetLeft}px)`;ink.style.width=b.offsetWidth+'px';
 const max=tabs.scrollWidth-tabs.clientWidth,t=Math.max(0,Math.min(max,b.offsetLeft-(tabs.clientWidth-b.offsetWidth)/2)),a=tabs.scrollLeft,d=t-a,T=performance.now(),id=++sid;
 (function f(n){if(id!==sid)return;const k=Math.min(1,(n-T)/1200),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;tabs.scrollLeft=a+d*e;if(k<1)requestAnimationFrame(f)})(T)}
function go(n,fast){
 n=Math.max(0,Math.min(N-1,n));
 idx=n;
 timers.forEach(clearTimeout);timers=[];
 const from=pages.filter(e=>e.classList.contains('off')).length,steps=Math.abs(n-from),gap=steps>1&&!fast?Math.min(240,1300/steps):0;
 pages.forEach((el,i)=>el.inert=i!==idx);
 busyUntil=performance.now()+gap*steps+300;const at=(d,f)=>d?timers.push(setTimeout(f,d)):f();
 if(n>from)for(let i=from;i<n;i++)at((i-from)*gap,()=>pages[i].classList.add('off'));
 else for(let i=from-1;i>=n;i--)at((from-1-i)*gap,()=>pages[i].classList.remove('off'));
 pages[idx].scrollTop=0;upd(pages[idx]);
 $('#cnt').textContent=idx===0?'':`${idx+1} / ${N}`;
 let cur=idx===N-1?N-1:0;if(idx<N-1)V.forEach((p,i)=>{if(p.tab&&i+1<=idx)cur=i+1});
 tabs.querySelectorAll('button').forEach(b=>{const on=+b.dataset.p===cur;b.classList.toggle('on',on);if(on)curTab=b});place();
}
$('#home').onclick=()=>go(0);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
let lp=false,lt=0,CODE='',sx=null,sy=0,st=0,lock=null,dEl=null,dDir=0,dp=0,tp=0,raf=0;
function paintDrag(){const q=dDir>0?dp:1-dp;dEl.style.transform=`rotateY(${-104*q}deg)`;dEl.style.filter=`brightness(${1-.22*q})`}
function loop(){raf=0;if(!dEl)return;dp+=(tp-dp)*.16;if(Math.abs(tp-dp)<.002)dp=tp;paintDrag();if(dp!==tp||sx!==null)raf=requestAnimationFrame(loop)}
book.addEventListener('pointerdown',e=>{lp=false;clearTimeout(lt);if(!owner&&e.target.closest('.lgw'))lt=setTimeout(()=>{lp=true;askCode()},5000);sx=e.clientX;sy=e.clientY;st=performance.now();lock=null;dEl=null});
addEventListener('pointermove',e=>{
 if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>10||Math.abs(dy)>10)clearTimeout(lt);
 if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8)){
  lock=Math.abs(dx)>Math.abs(dy)*.9?'h':'v';
  if(lock==='h'){dDir=dx<0?1:-1;const t=dDir>0?idx:idx-1;
   if(t<0||t>N-2&&dDir>0||performance.now()<busyUntil)lock='v';
   else{dEl=pages[t];dEl.style.transition='none';dEl.style.opacity=1;dEl.style.willChange='transform,filter';dp=tp=0;if(!raf)raf=requestAnimationFrame(loop)}}}
 if(lock==='h'&&dEl){const b=book.getBoundingClientRect(),cx=b.left+b.width/2,den=Math.max(dDir>0?sx-cx:cx-sx,b.width*.25);tp=Math.max(0,Math.min(1,-dDir*dx/den))}
});
function release(e,cancel){
 clearTimeout(lt);if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy,dt=performance.now()-st;sx=null;
 if(lock==='h'&&dEl){const el=dEl;dEl=null;const commit=!cancel&&(tp>.14||(dt<400&&Math.abs(dx)>18));
  el.style.transition='';el.style.transform='';el.style.filter='';el.style.opacity='';el.style.willChange='';
  if(commit)go(idx+dDir);return}
 if(!cancel&&lock===null&&Math.abs(dx)<10&&Math.abs(dy)<10&&!lp&&!e.target.closest('button,[data-e]')){const b=book.getBoundingClientRect();go(e.clientX-b.left<b.width*.3?idx-1:idx+1)}
}
addEventListener('pointerup',e=>release(e,false));
addEventListener('pointercancel',e=>release(e,true));
const setEd=()=>{$('#e1').hidden=!owner;$('#e1').textContent=edit?'Listo':'Editar';$('#e2').hidden=!edit};
function rb(k){book.classList.add('nt');boot();setEd();go(k,true);setTimeout(()=>book.classList.remove('nt'),90)}
const keep=()=>{try{sessionStorage.setItem('dc_i',idx);sessionStorage.setItem('dc_e',edit?'1':'0')}catch(e){}};
const sheet=h=>{sh.innerHTML=h;sh.inert=false;sh.classList.add('open');$('#cx').onclick=close};
function close(){sh.classList.remove('open');sh.inert=true}
const fld=(l,i,v,t)=>`<label>${l}<input id="${i}" type="${t||'text'}" value="${esc(v)}"></label>`;
async function save(){close();keep();rb(idx);$('#cnt').textContent='Guardando…';
 try{const r=await fetch('/.netlify/functions/save',{method:'POST',body:JSON.stringify({code:CODE,data:DATA})});$('#cnt').textContent=r.ok?'Guardado · se verá en 1–2 min':'No se pudo guardar'}catch(e){$('#cnt').textContent='No se pudo guardar'}}
function askCode(){sheet(`<h3>Entrar<button class="x" id="cx">×</button></h3>${fld('Código','c_i','','password')}<p id="c_m" style="margin:10px 0 0;font:14px var(--sans);color:#9b2c1d"></p><button class="go" id="sv">Entrar</button>`);
 $('#sv').onclick=async()=>{const c=$('#c_i').value;$('#sv').disabled=true;
  try{const r=await fetch('/.netlify/functions/save',{method:'POST',body:JSON.stringify({code:c})});
   if(r.ok){CODE=c;owner=true;edit=true;close();rb(idx)}else{$('#c_m').textContent='Código incorrecto';$('#sv').disabled=false}}
  catch(e){$('#c_m').textContent='Sin conexión';$('#sv').disabled=false}}}
function openItem(si,ri){const nw=ri<0,r=nw?['','','',0,0]:M[si].i[ri];if(nw){const c=M.indexOf(V[idx-1]);si=c>=0?c:0}
 sheet(`<h3>${nw?'Nuevo producto':'Editar producto'}<button class="x" id="cx">×</button></h3>${fld('Nombre','f_n',r[0])}<label id="lp">Precio (vacío = consultar)<input id="f_p" type="number" inputmode="numeric" value="${r[1]||''}"></label>${fld('Nota (opcional)','f_o',r[2])}<label class="ck"><input id="f_f" type="checkbox"${r[3]?' checked':''}> Favorito</label><label class="ck"><input id="f_a" type="checkbox"${r[4]?' checked':''}> Agotado</label><label>Sección<select id="f_s">${M.map((p,i)=>`<option value="${i}">${p.t}</option>`).join('')}</select></label><label>Posición<select id="f_q"></select></label><button class="go" id="sv">Guardar</button>${nw?'':'<button class="dl" id="dl">Eliminar</button>'}`);
 const fq=()=>{const s=+$('#f_s').value,same=!nw&&s===si,rs=M[s].i.filter((x,j)=>!(same&&j===ri));
  $('#f_q').innerHTML='<option value="0">Al inicio</option>'+rs.map((x,j)=>`<option value="${j+1}">Después de: ${x.h?'(título) '+esc(x.h):esc(x[0])}</option>`).join('');
  $('#f_q').value=same?ri:rs.length;$('#lp').hidden=!!M[s].fl};
 $('#f_s').value=si;$('#f_s').onchange=fq;fq();
